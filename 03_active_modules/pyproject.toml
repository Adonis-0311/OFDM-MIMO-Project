[project]
name = "ofdm-mimo-radar-estimation-active-modules"
version = "0.1.0"
description = "Active Python modules for the v2.3R mmWave ISAC T-OMP-Net experiment line."
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "pytest>=8.0",
  "torch>=2.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]
addopts = "-q"
